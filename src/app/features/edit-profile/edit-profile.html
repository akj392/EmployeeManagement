<section class="page-shell">
  <div class="page-header">
    <div>
      <p class="eyebrow">Account</p>
      <h2>Edit Profile</h2>
    </div>
  </div>

  <mat-card class="form-card" appearance="outlined">
    <form [formGroup]="profileForm" (ngSubmit)="save()">
      <div class="avatar-section">
        <img class="avatar-preview" [src]="previewUrl" alt="Profile preview" />
        <div>
          <h3>Profile picture</h3>
          <p>Choose a new image to update your profile photo.</p>
          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        </div>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="fullName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <input matInput formControlName="department" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Bio</mat-label>
          <textarea matInput rows="4" formControlName="bio"></textarea>
        </mat-form-field>
      </div>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit">Save Changes</button>
      </div>
    </form>
  </mat-card>
</section>
