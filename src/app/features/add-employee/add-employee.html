<section class="page-shell">
  <div class="page-header">
    <div>
      <p class="eyebrow">People</p>
      <h2>Add Employee</h2>
    </div>
  </div>

  <mat-card class="form-card" appearance="outlined">
    <form [formGroup]="employeeForm" (ngSubmit)="submit()">
      <div class="upload-box">
        <div class="preview-pane">
          @if (imagePreview) {
            <img [src]="imagePreview" alt="Preview" class="preview-image" />
          } @else {
            <div class="preview-placeholder">
              <mat-icon>person</mat-icon>
            </div>
          }
        </div>

        <div class="upload-content">
          <label class="upload-label" for="employee-image">
            <mat-icon>cloud_upload</mat-icon>
            <span>Drag & drop or click to upload a profile image</span>
          </label>
          <input id="employee-image" type="file" accept="image/*" (change)="onImageSelected($event)" />
        </div>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter full name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="name@company.com" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            @for (role of roles; track role) {
              <mat-option [value]="role">{{ role }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <mat-select formControlName="department">
            @for (department of departments; track department) {
              <mat-option [value]="department">{{ department }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option value="Active">Active</mat-option>
            <mat-option value="On Leave">On Leave</mat-option>
            <mat-option value="Pending">Pending</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-flat-button color="primary" type="submit">Save Employee</button>
      </div>
    </form>
  </mat-card>
</section>
