<mat-sidenav-container class="container">
  <mat-sidenav
    [opened]="shouldOpen()"
    [mode]="isMobile() ? 'over' : 'side'"
    class="sidenav"
    [fixedInViewport]="isMobile()">
    <app-sidenav (click)="closeSidenav()"></app-sidenav>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header (menuClicked)="toggleSidenav()"></app-header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
